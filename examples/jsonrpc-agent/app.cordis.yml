# Embedded DSH agent deployment for the bundled dsh-jsonrpc-agent runtime.
# Aligned with the real plugin tree of the deepseek-harness checkout
# (reference: examples/jsonrpc-agent/cordis.yml in the repo).
#
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.
#
# NOTE on plugin resolution: the loader resolves bare plugin names relative to
# the Node project that owns this config file. Two supported placements:
#   1. Copy this file into <dsh-repo>\examples\jsonrpc-agent\ (recommended:
#      the repo root node_modules already links every workspace plugin).
#   2. Or create a standalone config project with the plugin packages installed.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# Generic multi-provider LLM adapter (same one your interactive DSH uses).
# The zai-coding-cn route mirrors ~/.dsh/settings.yaml; the key resolves
# from the ZAI_CODING_CN_API_KEY environment variable.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      zai-coding-cn:
        apiKeyEnv: ZAI_CODING_CN_API_KEY
        models:
          - id: glm-4.7
            name: GLM-4.7
            contextWindow: 204800
            maxTokens: 131072
          - id: glm-5-turbo
            name: GLM-5-Turbo
            contextWindow: 200000
            maxTokens: 131072
          - id: glm-5.1
            name: GLM-5.1
            contextWindow: 200000
            maxTokens: 131072
          - id: glm-5.2
            name: GLM-5.2
            contextWindow: 1000000
            maxTokens: 131072

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# The agent spine: loop, tools pipeline, skills, session log, system prompt.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful assistant embedded in a business application. Answer in the user language, keep it brief.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# Durable JSONL session logs under the app directory.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# Durability barriers before model calls and top-level tool effects.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Subagent fan-out (in-process spawn provider).
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Filesystem tools.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# Business tool bridge to the host application (relative plugin, resolved
# beside this config file — see plugins/tool-customers.mjs).
- id: tool-customers
  name: './plugins/tool-customers.mjs'
  config:
    baseUrl: !!js process.env.DSH_CUSTOMERS_API ?? 'http://localhost:8080'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Request pressure measurement + compaction after threshold.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
